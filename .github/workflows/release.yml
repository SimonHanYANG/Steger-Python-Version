name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Select existing release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          uv run --frozen --extra dev python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              tag = os.environ["INPUT_TAG"]
          elif os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
          else:
              tag = "v" + version.removesuffix(".0")
          assert tag in {"v" + version, "v" + version.removesuffix(".0")}
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("RELEASE_TAG=" + tag + "\n")
          PY
      - name: Verify tagged version
        run: |
          git checkout "$RELEASE_TAG"
          uv run --frozen --extra dev python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from steger import __version__

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          assert __version__ == version
          assert tag in {"v" + version, "v" + version.removesuffix(".0")}
          assert (Path("docs/releases") / (tag + ".md")).is_file()
          PY
      - name: Run tests
        run: uv run --frozen --extra dev pytest -q
      - name: Build wheel and source archive
        run: uv build
      - name: Compute artifact checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          artifacts = sorted(Path("dist").glob("*.whl")) + sorted(Path("dist").glob("*.tar.gz"))
          assert len(artifacts) == 2
          lines = [hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name for p in artifacts]
          Path("dist/SHA256SUMS").write_text("\n".join(lines) + "\n")
          PY
      - name: Create release and upload verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-draft.txt; then
            if [ "$(cat release-draft.txt)" = "false" ]; then
              echo "Release is already published; leaving its artifacts unchanged."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
              --verify-tag --draft --title "Steger Python $RELEASE_TAG" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
