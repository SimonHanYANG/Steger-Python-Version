name: Publish release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify release metadata
        run: |
          uv run --frozen --extra dev python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from steger import __version__

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert __version__ == version
          assert tag in {"v" + version, "v" + version.removesuffix(".0")}
          assert (Path("docs/releases") / (tag + ".md")).is_file()
          PY
      - name: Run tests
        run: uv run --frozen --extra dev pytest -q
      - name: Build wheel and source archive
        run: uv build
      - name: Compute artifact checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          artifacts = sorted(Path("dist").glob("*.whl")) + sorted(Path("dist").glob("*.tar.gz"))
          assert len(artifacts) == 2
          lines = [hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name for p in artifacts]
          Path("dist/SHA256SUMS").write_text("\n".join(lines) + "\n")
          PY
      - name: Create release and upload verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --draft --title "Steger Python $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
