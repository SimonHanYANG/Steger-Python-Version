name: Numerical regression tests

on:
  push:
    branches: [main, 'perf/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra native
      - name: Build validated native backend (Linux)
        if: runner.os != 'macOS'
        run: uv run --frozen --extra dev --extra native python tools/build_native.py
      - run: uv run --frozen --extra dev --extra native pytest -q
      - name: Validate Python fallback
        if: runner.os != 'macOS'
        env:
          STEGER_DISABLE_NATIVE: "1"
        run: uv run --frozen --extra dev --extra native pytest -q
