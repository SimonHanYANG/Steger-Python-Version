[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "steger-precision"
version = "0.1.0"
description = "Float64 Steger line extraction with explicit accuracy validation"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "pillow>=11"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.9"]
halcon = ["mvtec-halcon"]

[project.scripts]
steger = "steger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/steger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

